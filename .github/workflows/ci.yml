name: CI
permissions:
  contents: read

on:
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore .NET dependencies
        run: dotnet restore Velo.sln

      - name: Build .NET solution
        run: dotnet build Velo.sln --no-restore --configuration Release

      - name: Run .NET tests
        run: dotnet test Velo.sln --no-build --configuration Release

      # Live round-trip against the real Foundry resource — catches the class of bug unit tests
      # can't: a status-code catch clause written against the wrong exception type compiles clean
      # and passes every mocked test, but never fires against the real service (see 2026-08-15
      # incident). Requires FOUNDRY_TENANT_ID / FOUNDRY_CLIENT_ID / FOUNDRY_CLIENT_SECRET as repo
      # secrets (Settings → Secrets and variables → Actions), plus FOUNDRY_ENDPOINT / FOUNDRY_DEPLOYMENT_NAME.
      # Guarded on the endpoint secret being set: PR builds from forks never receive repo secrets,
      # and this shouldn't hard-fail every PR before the secrets are configured the first time.
      - name: Check Foundry secrets are configured
        id: foundry-secrets
        run: echo "configured=${{ secrets.FOUNDRY_ENDPOINT != '' }}" >> "$GITHUB_OUTPUT"

      - name: Live Foundry connectivity check
        if: steps.foundry-secrets.outputs.configured == 'true'
        run: dotnet run --project tools/FoundryConnectivityCheck --configuration Release
        env:
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          FOUNDRY_DEPLOYMENT_NAME: ${{ secrets.FOUNDRY_DEPLOYMENT_NAME }}
          FOUNDRY_TENANT_ID: ${{ secrets.FOUNDRY_TENANT_ID }}
          FOUNDRY_CLIENT_ID: ${{ secrets.FOUNDRY_CLIENT_ID }}
          FOUNDRY_CLIENT_SECRET: ${{ secrets.FOUNDRY_CLIENT_SECRET }}

      - name: Copy screenshots into extension directory
        run: |
          mkdir -p src/Velo.Extension/docs/screenshots
          cp docs/screenshots/*.png src/Velo.Extension/docs/screenshots/

      - name: Install extension dependencies
        working-directory: src/Velo.Extension
        run: npm install

      - name: Build extension
        working-directory: src/Velo.Extension
        run: npm run build

      - name: Install tfx-cli
        run: npm install -g tfx-cli

      - name: Package and validate extension
        working-directory: src/Velo.Extension
        run: tfx extension create --manifest-globs vss-extension.json --output-path /tmp/velo-ext --no-prompt
